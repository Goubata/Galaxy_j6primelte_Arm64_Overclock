name: Build Android Kernel 3.18

on:
  push:
    branches:
      - lineage-17.1-64  # 必要に応じて変更
  pull_request:
    branches:
      - lineage-17.1-64

jobs:
  build:
    runs-on: ubuntu-20.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential bc libncurses5-dev ccache flex bison \
                              zip curl git python3 libssl-dev

      - name: Setup GCC 4.9 toolchain
        run: |
          mkdir -p ~/toolchains
          cd ~/toolchains
          wget -q https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/+archive/refs/heads/master.tar.gz -O gcc-4.9.tar.gz
          tar -xzf gcc-4.9.tar.gz
          echo "TOOLCHAIN=$(pwd)/bin" >> $GITHUB_ENV

      - name: Configure kernel
        run: |
          export PATH=$TOOLCHAIN:$PATH
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-android- j6primelte_defconfig

      - name: Build kernel
        run: |
          export PATH=$TOOLCHAIN:$PATH
          make -j$(nproc) ARCH=arm64 CROSS_COMPILE=aarch64-linux-android-

      - name: Upload kernel image
        uses: actions/upload-artifact@v4
        with:
          name: kernel-image
          path: arch/arm64/boot/Image.gz-dtb
