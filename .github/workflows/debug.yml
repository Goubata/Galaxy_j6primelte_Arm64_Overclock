name: Debug Toolchain

on:
  workflow_dispatch:

jobs:
  debug-toolchain:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up environment variables
        run: |
          echo "TOOLCHAIN_URL=https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/+archive/master.tar.gz" >> $GITHUB_ENV
          echo "TOOLCHAIN_DIR=$GITHUB_WORKSPACE/toolchains" >> $GITHUB_ENV

      - name: Create toolchain directory
        run: mkdir -p $TOOLCHAIN_DIR

      - name: Download toolchain
        run: |
          wget -O toolchain.tar.gz $TOOLCHAIN_URL || { echo "Failed to download toolchain"; exit 1; }

      - name: Extract toolchain
        run: |
          tar -xzf toolchain.tar.gz -C $TOOLCHAIN_DIR || { echo "Failed to extract toolchain"; exit 1; }

      - name: Check extracted files
        run: |
          echo "Listing toolchain directory:"
          ls -lah $TOOLCHAIN_DIR
          echo "Listing toolchain/bin directory:"
          ls -lah $TOOLCHAIN_DIR/bin || echo "No bin directory found"

      - name: Check toolchain binaries
        run: |
          if [ -f "$TOOLCHAIN_DIR/bin/aarch64-linux-android-gcc" ]; then
            echo "GCC found:"
            file $TOOLCHAIN_DIR/bin/aarch64-linux-android-gcc
          else
            echo "GCC not found in toolchain"
            exit 1
          fi
