name: Debug Toolchain

on:
  workflow_dispatch: # 手動で実行可能

jobs:
  debug:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set environment variables
        run: |
          export TOOLCHAIN_URL="https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/+archive/master.tar.gz"
          export TOOLCHAIN_DIR="$GITHUB_WORKSPACE/toolchains"
          echo "TOOLCHAIN_URL=$TOOLCHAIN_URL" >> $GITHUB_ENV
          echo "TOOLCHAIN_DIR=$TOOLCHAIN_DIR" >> $GITHUB_ENV

      - name: Download toolchain
        run: |
          mkdir -p $TOOLCHAIN_DIR
          wget -O toolchain.tar.gz $TOOLCHAIN_URL
          ls -lh toolchain.tar.gz

      - name: Verify downloaded tarball
        run: |
          echo "Checking tarball contents:"
          tar -tzf toolchain.tar.gz || { echo "Failed to list tar contents"; exit 1; }

      - name: Extract toolchain
        run: |
          tar -xvzf toolchain.tar.gz -C $TOOLCHAIN_DIR || { echo "Failed to extract toolchain"; exit 1; }
          ls -lh $TOOLCHAIN_DIR

      - name: Check toolchain directory structure
        run: |
          echo "Listing toolchain directory:"
          ls -lh $TOOLCHAIN_DIR
          echo "Listing toolchain/bin directory:"
          ls -lh $TOOLCHAIN_DIR/bin || echo "No bin directory found"

      - name: Verify GCC binary
        run: |
          if [ -f "$TOOLCHAIN_DIR/bin/aarch64-linux-android-gcc" ]; then
            echo "GCC found:"
            ls -lh $TOOLCHAIN_DIR/bin/aarch64-linux-android-gcc
          else
            echo "GCC not found in toolchain"
            exit 1
          fi
