name: Debug Kernel Build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: 必要なパッケージをインストール
        run: |
          sudo apt update
          sudo apt install -y build-essential flex bison libssl-dev bc

      - name: ツールチェーンをダウンロード
        run: |
          TOOLCHAIN_URL="https://releases.linaro.org/components/toolchain/binaries/latest-4.9/aarch64-linux-gnu/"
          TOOLCHAIN_DIR=$HOME/toolchain
          mkdir -p $TOOLCHAIN_DIR
          wget -q --show-progress $TOOLCHAIN_URL/aarch64-linux-gnu-gcc -P $TOOLCHAIN_DIR/bin
          wget -q --show-progress $TOOLCHAIN_URL/aarch64-linux-gnu-g++ -P $TOOLCHAIN_DIR/bin
          wget -q --show-progress $TOOLCHAIN_URL/aarch64-linux-gnu-ld -P $TOOLCHAIN_DIR/bin
          chmod +x $TOOLCHAIN_DIR/bin/*

      - name: 環境変数を設定
        run: |
          echo "CROSS_COMPILE=$HOME/toolchain/bin/aarch64-linux-gnu-" >> $GITHUB_ENV
          echo "ARCH=arm64" >> $GITHUB_ENV
          echo "PATH=$HOME/toolchain/bin:$PATH" >> $GITHUB_ENV

      - name: カーネルをビルド
        run: |
          make defconfig
          make -j$(nproc)
