name: Build Kernel 3.18

on:
  push:
    branches:
      - lineage-17.1-64
  pull_request:
    branches:
      - lineage-17.1-64
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-20.04  # 旧カーネル向けの環境

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        sudo apt update
        sudo apt install -y repo wget curl git unzip

    - name: Install dependencies
      run: |
        sudo apt install -y build-essential gcc g++ libncurses5-dev libssl-dev bc flex bison

    - name: Initialize repo for Android Kernel 3.18
      run: |
        mkdir android-kernel && cd android-kernel
        repo init -u https://android.googlesource.com/kernel/manifest -b android-msm-marlin-3.18-oreo
        repo sync -j$(nproc)  # Fetch all necessary files

    - name: Set up Toolchain (AOSP)
      run: |
        TOOLCHAIN_URL="https://developer.arm.com/downloads/-/arm-gnu-toolchain-downloads"
        TOOLCHAIN_DIR="$HOME/aosp-toolchain"
        mkdir -p $TOOLCHAIN_DIR
        curl -L $TOOLCHAIN_URL -o toolchain.tar.gz
        tar -xvzf toolchain.tar.gz -C $TOOLCHAIN_DIR
        export PATH=$TOOLCHAIN_DIR/bin:$PATH
        echo "Toolchain setup complete"

    - name: Build Kernel
      run: |
        cd android-kernel
        make ARCH=arm64 CROSS_COMPILE=aarch64-linux-android- O=out j6primelte_defconfig
        make ARCH=arm64 CROSS_COMPILE=aarch64-linux-android- -j$(nproc) O=out zImage

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v2  # v3ではなくv2に変更
      with:
        name: android-kernel-build
        path: android-kernel/out/arch/arm64/boot/zImage
