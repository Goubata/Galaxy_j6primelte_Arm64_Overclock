name: Build Kernel 3.18

on:
  push:
    branches:
      - lineage-17.1-64
  pull_request:
    branches:
      - lineage-17.1-64
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-20.04  # 古いカーネルに適した環境を使用

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        sudo apt update
        sudo apt install -y gcc-4.9 g++-4.9 gcc-4.9-multilib g++-4.9-multilib \
                            make bc bison flex libssl-dev libncurses5-dev

    - name: Download and Setup GCC 4.9 Toolchain
      run: |
        TOOLCHAIN_URL="https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/+archive/master.tar.gz"
        mkdir -p toolchains && cd toolchains
        wget -qO- $TOOLCHAIN_URL | tar -xz
        echo "PATH=$GITHUB_WORKSPACE/toolchains/bin:$PATH" >> $GITHUB_ENV

    - name: Configure Kernel
      run: |
        export ARCH=arm64
        export SUBARCH=arm64
        export CROSS_COMPILE=$GITHUB_WORKSPACE/toolchains/bin/aarch64-linux-android-
        export CROSS_COMPILE_ARM32=$GITHUB_WORKSPACE/toolchains/bin/arm-linux-androideabi-
        
        mkdir -p out
        make O=out j6primelte_defconfig

    - name: Compile Kernel
      run: |
        export ARCH=arm64
        export SUBARCH=arm64
        export CROSS_COMPILE=$GITHUB_WORKSPACE/toolchains/bin/aarch64-linux-android-
        export CROSS_COMPILE_ARM32=$GITHUB_WORKSPACE/toolchains/bin/arm-linux-androideabi-

        make -j$(nproc) O=out

    - name: Upload Kernel Image
      uses: actions/upload-artifact@v4
      with:
        name: kernel-3.18-build
        path: out/arch/arm64/boot/Image.gz-dtb
