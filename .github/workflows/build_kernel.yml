name: Build Kernel 3.18

on:
  push:
    branches:
      - lineage-17.1-64
  pull_request:
    branches:
      - lineage-17.1-64
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-20.04  # 旧カーネル向けの環境

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        sudo apt update
        sudo apt install -y make bc bison flex libssl-dev libncurses5-dev

    - name: Download and Setup GCC 4.9 Toolchain
      run: |
        TOOLCHAIN_URL="https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/+archive/master.tar.gz"
        TOOLCHAIN_DIR="$GITHUB_WORKSPACE/toolchains"

        mkdir -p $TOOLCHAIN_DIR
        wget -qO toolchain.tar.gz $TOOLCHAIN_URL
        tar -xzf toolchain.tar.gz -C $TOOLCHAIN_DIR

        ls -lah $TOOLCHAIN_DIR/bin  # デバッグ用: ツールチェーンが正しく展開されたか確認

        echo "PATH=$TOOLCHAIN_DIR/bin:$PATH" >> $GITHUB_ENV
        echo "CROSS_COMPILE=$TOOLCHAIN_DIR/bin/aarch64-linux-android-" >> $GITHUB_ENV
        echo "CROSS_COMPILE_ARM32=$TOOLCHAIN_DIR/bin/arm-linux-androideabi-" >> $GITHUB_ENV

    - name: Configure Kernel
      run: |
        export ARCH=arm64
        export SUBARCH=arm64
        export CROSS_COMPILE=$GITHUB_WORKSPACE/toolchains/bin/aarch64-linux-android-
        export CROSS_COMPILE_ARM32=$GITHUB_WORKSPACE/toolchains/bin/arm-linux-androideabi-

        mkdir -p out
        make O=out j6primelte_defconfig

    - name: Compile Kernel
      run: |
        export ARCH=arm64
        export SUBARCH=arm64
        export CROSS_COMPILE=$GITHUB_WORKSPACE/toolchains/bin/aarch64-linux-android-
        export CROSS_COMPILE_ARM32=$GITHUB_WORKSPACE/toolchains/bin/arm-linux-androideabi-

        make -j$(nproc) O=out

    - name: Upload Kernel Image
      uses: actions/upload-artifact@v4
      with:
        name: kernel-3.18-build
        path: out/arch/arm64/boot/Image.gz-dtb
