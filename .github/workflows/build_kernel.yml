name: Build Kernel

on:
  push:
    branches:
      - lineage-17.1-64
  pull_request:
    branches:
      - lineage-17.1-64

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout source
      uses: actions/checkout@v4

    - name: Install dependencies
      run: sudo apt update && sudo apt install -y clang lld build-essential bc libssl-dev flex bison

    - name: Setup Toolchain
      run: |
        TOOLCHAIN_URL="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/main.tar.gz"
        mkdir -p toolchains && cd toolchains
        wget -qO- $TOOLCHAIN_URL | tar -xz
        echo "PATH=$GITHUB_WORKSPACE/toolchains/bin:$PATH" >> $GITHUB_ENV

    - name: Compile Kernel
      run: |
        export ARCH=arm64
        export SUBARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
        export CLANG_TRIPLE=aarch64-linux-gnu-

        mkdir -p out
        make O=out <defconfig名>
        make -j$(nproc) O=out CC=clang LLVM=1

    - name: Upload Kernel Image
      uses: actions/upload-artifact@v4
      with:
        name: kernel
        path: out/arch/arm64/boot/Image.gz-dtb
