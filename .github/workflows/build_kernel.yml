name: Build Kernel

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout source
      uses: actions/checkout@v4

    - name: Set up environment
      run: |
        sudo apt update
        sudo apt install -y clang lld git wget curl

    - name: Download and Set Up Toolchain
      run: |
        mkdir -p $GITHUB_WORKSPACE/toolchains
        cd $GITHUB_WORKSPACE/toolchains
        wget https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/main.tar.gz -O clang.tar.gz
        tar -xzf clang.tar.gz
        export PATH="$GITHUB_WORKSPACE/toolchains/bin:$PATH"

    - name: Compile Kernel
      run: |
        export ARCH=arm64
        export SUBARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
        export CLANG_TRIPLE=aarch64-linux-gnu-
        export PATH="$GITHUB_WORKSPACE/toolchains/bin:$PATH"

        mkdir -p out
        make O=out <defconfig名>
        make -j$(nproc) O=out CC=clang LLVM=1

    - name: Upload Kernel Image
      uses: actions/upload-artifact@v4
      with:
        name: kernel
        path: out/arch/arm64/boot/Image.gz-dtb
