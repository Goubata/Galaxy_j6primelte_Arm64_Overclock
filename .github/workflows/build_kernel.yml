name: Build Kernel 3.18

on:
  push:
    branches:
      - lineage-17.1-64
  pull_request:
    branches:
      - lineage-17.1-64
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-20.04  # 旧カーネル向けの環境

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v3  # v4 は相性が悪いため v3 を使用

    - name: Install Dependencies
      run: |
        sudo apt update
        sudo apt install -y wget curl git unzip python3 build-essential gcc g++ libncurses5-dev libssl-dev bc flex bison

    - name: Install repo manually
      run: |
        mkdir -p $HOME/bin
        curl -o $HOME/bin/repo https://storage.googleapis.com/git-repo-downloads/repo || (echo "Failed to download repo"; exit 1)
        chmod +x $HOME/bin/repo
        echo "$HOME/bin" >> $GITHUB_PATH  # GitHub Actions でパスを確実に適用
        export PATH="$HOME/bin:$PATH"  # 即時適用
        hash -r  # コマンドキャッシュをクリア
        which repo || (echo "repo command not found"; exit 1)
        
    - name: Set up Toolchain (AOSP)
      run: |
        TOOLCHAIN_URL="https://developer.arm.com/-/media/Files/downloads/gnu-rm/10-2020-q4-major/gcc-arm-none-eabi-10-2020-q4-major-x86_64-linux.tar.bz2"
        TOOLCHAIN_DIR="$HOME/aosp-toolchain"
        mkdir -p $TOOLCHAIN_DIR
        curl -L $TOOLCHAIN_URL -o toolchain.tar.bz2 || (echo "Failed to download toolchain"; exit 1)
        tar -xvjf toolchain.tar.bz2 -C $TOOLCHAIN_DIR || (echo "Failed to extract toolchain"; exit 1)
        echo "$TOOLCHAIN_DIR/bin" >> $GITHUB_PATH
        export PATH="$TOOLCHAIN_DIR/bin:$PATH"
        echo "Toolchain setup complete"

    - name: Build Kernel
      run: |
        make ARCH=arm64 CROSS_COMPILE=aarch64-linux-android- O=out j6primelte_defconfig || (echo "Defconfig failed"; exit 1)
        make ARCH=arm64 CROSS_COMPILE=aarch64-linux-android- -j$(nproc) O=out zImage || (echo "Kernel build failed"; exit 1)

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: android-kernel-build
        path: android-kernel/out/arch/arm64/boot/zImage
