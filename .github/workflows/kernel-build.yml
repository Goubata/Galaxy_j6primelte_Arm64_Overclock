name: Kernel Build

on:
  push:
    branches:
      - lineage-17.1-64
  pull_request:
    branches:
      - lineage-17.1-64
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential gcc-aarch64-linux-gnu bc bison flex libssl-dev ccache libncurses5-dev

      - name: Set up environment
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export PATH=/usr/bin:$PATH

      - name: Configure Kernel
        run: |
          make O=out j6primelte_defconfig  # or your specific defconfig

      - name: Build Kernel
        run: |
          make O=out -j$(nproc)  # Adjust the number of cores based on your system

